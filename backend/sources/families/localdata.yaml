# 지방행정 인허가(LOCALDATA) 계열: 서울 열린데이터광장의 서울 전체판 'LOCALDATA_<업종코드>' 서비스 (2026-11-22 기준 161개).
# 상세 화면 설명에 '좌표안내 : 중부원점TM(EPSG:5174) 좌표계에 따른 해당위치의 좌표정보이며 위경도 좌표는
# 제공하고 있지 않음'이라고 적혀 있다 (동물병원 OA-16007, 비디오물감상실업 OA-16038에서 확인).
# 받은 서울 동물병원(영업 중 988곳) 중 좌표·주소가 있는 963곳을 EPSG:5174로 바꾸면 모두 지번주소의 자치구 안에 든다
# (같은 값을 EPSG:2097로 보면 94.8%, 5181은 95.2%, 5186은 0%. 2026-11-22).
# 폐업 사업장이 많아(동물병원 2,246건 중 1,242건) 영업 중인 사업장만 적재한다. 원본은 3일 전 자료이고 매일 갱신된다.
family_id: localdata
service_pattern: 'LOCALDATA_\d+'
crs: EPSG:5174
keep_rows:
  column: TRDSTATENM
  values: [영업/정상]
refresh_days: 7
description_note: 영업 중(영업상태 '영업/정상')인 사업장만 적재한다. 폐업·휴업·취소 사업장은 빠진다
